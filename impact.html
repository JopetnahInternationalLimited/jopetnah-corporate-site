<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Our Impact & Sustainability | Jopetnah International Limited</title>
    <meta name="description" content="Explore Jopetnah's commitment to sustainable development, ESG principles, and measurable impact across communities and industries.">
    <link rel="canonical" href="https://jopetnahinternationallimited.github.io/jopetnah-corporate-site/impact.html" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Impact & Sustainability | Jopetnah International Limited" />
    <meta property="og:description" content="Driving positive change through responsible business practices and sustainable solutions." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jopetnahinternationallimited.github.io/jopetnah-corporate-site/impact.html" />

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --card-bg: #f8f9fa;
            --accent: #0066cc;
        }
        
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --card-bg: #2d2d2d;
            --accent: #4da6ff;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            transition: all 0.3s ease;
        }

        .impact-dashboard {
            padding: 40px 20px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .chart-container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .toggle-btn {
            padding: 10px 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        #map {
            height: 400px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<section class="impact-dashboard">
    <div class="header">
        <h2>Jopetnah Impact Dashboard</h2>
        <button class="toggle-btn" id="theme-toggle">🌙 Dark Mode</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h3 id="years">9</h3><p>Years Operating</p></div>
        <div class="stat-card"><h3 id="countries">20+</h3><p>Countries Served</p></div>
        <div class="stat-card"><h3 id="projects">150+</h3><p>Projects Completed</p></div>
        <div class="stat-card"><h3 id="people">25000+</h3><p>Beneficiaries Impacted</p></div>
    </div>

    <!-- Filter -->
    <div class="chart-container">
        <label><strong>Filter by Sector:</strong></label>
        <select id="sectorFilter" style="padding:8px; margin-left:10px; border-radius:6px;">
            <option value="all">All Sectors</option>
            <option value="agri">Agriculture</option>
            <option value="const">Construction</option>
            <option value="edu">Education</option>
        </select>
    </div>

    <!-- Line Chart: Impact Over Years -->
    <div class="chart-container">
        <h3>Impact Growth Over Years</h3>
        <canvas id="impactLineChart" height="100"></canvas>
    </div>

    <!-- Geographic Map -->
    <div class="chart-container">
        <h3>Geographic Footprint</h3>
        <div id="map"></div>
    </div>
</section>

<script>
    // Theme Toggle
    const toggleBtn = document.getElementById('theme-toggle');
    const body = document.body;

    function setTheme(theme) {
        body.setAttribute('data-theme', theme);
        toggleBtn.textContent = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
        localStorage.setItem('theme', theme);
    }

    // Initialize theme
    setTheme(localStorage.getItem('theme') || 'light');

    toggleBtn.addEventListener('click', () => {
        const currentTheme = body.getAttribute('data-theme');
        setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    // Counter Animation
    function animateCounter(id, target, suffix = "") {
        let start = 0;
        const el = document.getElementById(id);
        const increment = target / 30;
        
        const timer = setInterval(() => {
            start += increment;
            if (start >= target) {
                el.textContent = target + suffix;
                clearInterval(timer);
            } else {
                el.textContent = Math.floor(start) + suffix;
            }
        }, 30);
    }

    // Line Chart
    const lineCtx = document.getElementById('impactLineChart');
    new Chart(lineCtx, {
        type: 'line',
        data: {
            labels: ['2018', '2019', '2020', '2021', '2022', '2023', '2024', '2025', '2026'],
            datasets: [
                {
                    label: 'Projects Completed',
                    data: [12, 28, 45, 67, 89, 110, 128, 142, 150],
                    borderColor: '#0066cc',
                    tension: 0.4
                },
                {
                    label: 'Beneficiaries Reached',
                    data: [1200, 3500, 6800, 10500, 14200, 17800, 21000, 23500, 25000],
                    borderColor: '#00cc99',
                    tension: 0.4
                }
            ]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'top' }
            },
            scales: {
                y: { beginAtZero: true }
            }
        }
    });

    // Leaflet Map
    const map = L.map('map').setView([1.5, 32.5], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Sample Project Markers
    const projects = [
        { lat: 0.3, lng: 32.5, name: "Kampala HQ - Education Project" },
        { lat: 2.8, lng: 32.3, name: "Gulu - Agriculture Initiative" },
        { lat: -1.2, lng: 30.1, name: "Rwanda Border - Renewable Energy" }
    ];

    projects.forEach(p => {
        L.marker([p.lat, p.lng]).addTo(map)
         .bindPopup(`<b>${p.name}</b><br>Completed 2025`);
    });

    // Sector Filter
    document.getElementById('sectorFilter').addEventListener('change', (e) => {
        alert(`Filtered to: ${e.target.value.toUpperCase()} sector. (Full filtering logic can be added here)`);
    });

    // Initialize counters
    window.onload = () => {
        animateCounter("years", 9);
        animateCounter("countries", 20, "+");
        animateCounter("projects", 150, "+");
        animateCounter("people", 25000, "+");
    };
</script>
</body>
</html>
