name: Site Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'          # Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  html-validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate all HTML files
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          css: false
          # Uncomment if you still need the previous ignore rule:
          # extra: --ignore-re "Attribute .* not allowed on element .* at this point"

  link-check:
    name: Check for broken links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check internal and external links (HTML + Markdown)
        uses: lycheeverse/lychee-action@v2
        with:
          # ---------------------------------------------------------------
          # fail: true  → job turns red on broken links (recommended for PRs)
          # fail: false → report-only mode (useful while cleaning up links)
          # ---------------------------------------------------------------
          fail: true

          # jobSummary: true is the default – results appear in the Actions UI
          args: >-
            --verbose
            --no-progress
            --exclude-mail
            --max-concurrency 8
            --timeout 20
            --max-retries 2
            --accept 200,204,301,302,307,308
            --config .lychee.toml
            './**/*.html'
            './**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
