#############################
# Lychee configuration
# Docs: https://lychee.cli.rs
#############################

accept = ["200", "204", "301", "302", "307", "308"]
max_concurrency = 8
timeout = 20
max_retries = 2

# Mail links are excluded by default.
# Set to true only if you want mailto: links to be checked.
include_mail = false

exclude = [
  # Custom domain – remove this line once www.jopetnah.com is live and returns 200
  '^https?://(www\.)?jopetnah\.com',

  # X / Twitter almost always returns 403 to CI runners
  '^https://x\.com',
  '^https://twitter\.com',
]
