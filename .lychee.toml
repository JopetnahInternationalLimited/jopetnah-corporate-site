# Lychee link-checker configuration (used by .github/workflows/quality-checks.yml)
# If a .lychee.toml already exists, merge these settings into it.

timeout = 20
max_retries = 2
retry_wait_time = 4
max_concurrency = 8
# mailto: links are skipped by default (include_mail defaults to false),
# so no setting is needed here.

# Social platforms and form endpoints routinely block bots and return 403/999 or
# reject non-POST requests, which would fail the build on healthy links.
# The site's own GitHub Pages URL is excluded because new pages return 404
# until they have been deployed (canonical and Open Graph URLs point at it).
exclude = [
  '^https://www\.facebook\.com/',
  '^https://www\.linkedin\.com/',
  '^https://x\.com/',
  '^https://www\.instagram\.com/',
  '^https://www\.tiktok\.com/',
  '^https://www\.youtube\.com/',
  '^https://formspree\.io/',
  '^https://www\.google\.com/maps/',
  '^https://jopetnahinternationallimited\.github\.io/',
]

# Also verify in-page anchors (e.g. services.html#sector-07 and README table-of-contents links)
include_fragments = true
