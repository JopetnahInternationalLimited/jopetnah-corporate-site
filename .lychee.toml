#############################
# Lychee configuration
# Docs: https://lychee.cli.rs
#############################

accept = ["200", "204", "301", "302", "307", "308"]
max_concurrency = 8
timeout = 20
max_retries = 2

# Mail is excluded by default; only set true if you want to check mailto: links
include_mail = false

exclude = [
  # Custom domain – remove once www.jopetnah.com is live and returns 200
  '^https?://(www\.)?jopetnah\.com',

  # X/Twitter returns 403 to CI runners
  '^https://x\.com',
  '^https://twitter\.com',
]
